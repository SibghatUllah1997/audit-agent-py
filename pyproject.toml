[project.urls]
Homepage = "https://github.com/SibghatUllah1997/audit-agent-py"
Repository = "https://github.com/SibghatUllah1997/audit-agent-py.git"
Issues = "https://github.com/SibghatUllah1997/audit-agent-py/issues"
Changelog = "https://github.com/SibghatUllah1997/audit-agent-py/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/SibghatUllah1997/audit-agent-py/blob/main/ROADMAP.md"
Documentation = "https://github.com/SibghatUllah1997/audit-agent-py#readme"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sibaudit"
version = "0.2.0"
description = "Simple Solidity static analyzer for risky patterns (educational)."
authors = [
  { name = "HM Sibghat Ullah", email = "h.m.sibghatullah1997@gmail.com" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["solidity", "security", "static-analysis", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/SibghatUllah1997/audit-agent-py"
Repository = "https://github.com/SibghatUllah1997/audit-agent-py"
Documentation = "https://github.com/SibghatUllah1997/audit-agent-py#readme"

[project.scripts]
sibaudit = "sibaudit.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q --cov=sibaudit --cov-report=term-missing"
testpaths = [
  "tests",
]

[tool.mypy]
python_version = "3.10"
packages = ["sibaudit"]
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[tool.coverage.run]
branch = true
source = ["sibaudit"]
omit = ["sibaudit/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
include = ["sibaudit/py.typed"]

