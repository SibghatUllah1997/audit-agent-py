[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sibaudit"
version = "0.1.0"
description = "Simple Solidity static analyzer for risky patterns (educational)."
authors = [
  { name = "HM Sibghat Ullah", email = "h.m.sibghatullah1997@gmail.com" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["solidity", "security", "static-analysis", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Environment :: Console",
]

[project.scripts]
sibaudit = "sibaudit.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = [
  "tests",
]

