# Copy this file to .github/workflows/sibaudit.yml in a Solidity project.
# Findings are printed as workflow commands and show up as inline annotations
# on pull requests. The job fails when the scan reports anything.
name: sibaudit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sibaudit
        run: |
          python -m pip install --upgrade pip
          pip install sibaudit

      - name: Scan Solidity files
        env:
          # Optional repository variables. Empty means "no filter".
          # SIBAUDIT_MIN_SEVERITY: HIGH | MEDIUM | LOW
          # SIBAUDIT_ONLY: A008,A009
          # SIBAUDIT_EXCEPT: A017
          SIBAUDIT_MIN_SEVERITY: ${{ vars.SIBAUDIT_MIN_SEVERITY }}
          SIBAUDIT_ONLY: ${{ vars.SIBAUDIT_ONLY }}
          SIBAUDIT_EXCEPT: ${{ vars.SIBAUDIT_EXCEPT }}
        run: python3 -m sibaudit --format github .
