repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: []
        args: [--strict]

  - repo: local
    hooks:
      - id: sibaudit
        name: sibaudit
        entry: sibaudit --format text
        language: system
        types_or: [file]
        files: "\\.(sol)$"
